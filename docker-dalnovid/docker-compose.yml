# Dalnovid server: ID server (hbbs) + relay (hbbr).
# Keys and the database live in ./data; back it up, the public key in
# ./data/id_ed25519.pub is what clients pin.
services:
  hbbs:
    image: ghcr.io/misterun/dalnovid-server:latest
    command: hbbs -r relay.dalnovid.ru:21117
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: ghcr.io/misterun/dalnovid-server:latest
    command: hbbr -k _  # only clients with this server's key may use the relay
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data:/root
    restart: unless-stopped
