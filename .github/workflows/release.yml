name: Release

# Multi-platform server build, on a version tag (v1.2.3) or by hand.
#   Linux:   amd64, arm64 (glibc 2.35+: Ubuntu 22.04+, Debian 12+)
#   Windows: x86_64
#   macOS:   arm64, x86_64
#   Docker:  ghcr.io/<owner>/dalnovid-server (amd64, arm64)
# On tags the archives are published as a GitHub release, which install.sh
# downloads from.

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, os: ubuntu-22.04 }
          - { name: arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --all-features
      - name: Package
        run: |
          d=dalnovid-server-linux-${{ matrix.job.name }}
          mkdir -p "$d"
          cp target/release/{hbbs,hbbr,dalnovid-utils} "$d"/
          chmod a+x "$d"/*
          cp LICENSE NOTICE "$d"/
          tar czf "$d.tar.gz" "$d"
          mkdir -p docker-bin/${{ matrix.job.name }}
          cp target/release/{hbbs,hbbr} docker-bin/${{ matrix.job.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.job.name }}
          path: dalnovid-server-linux-${{ matrix.job.name }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: docker-bin-${{ matrix.job.name }}
          path: docker-bin/
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release --all-features
      - name: Package
        shell: pwsh
        run: |
          $d = "dalnovid-server-windows-x86_64"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\hbbs.exe, target\release\hbbr.exe, target\release\dalnovid-utils.exe, LICENSE, NOTICE $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dalnovid-server-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.job.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: arm64,  target: aarch64-apple-darwin }
          - { name: x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}
      - name: Build
        run: cargo build --locked --release --all-features --target ${{ matrix.job.target }}
      - name: Package
        run: |
          d=dalnovid-server-macos-${{ matrix.job.name }}
          mkdir -p "$d"
          cp target/${{ matrix.job.target }}/release/{hbbs,hbbr,dalnovid-utils} "$d"/
          cp LICENSE NOTICE "$d"/
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.job.name }}
          path: dalnovid-server-macos-${{ matrix.job.name }}.tar.gz
          if-no-files-found: error

  docker:
    name: Docker image
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-bin-*
          path: docker-dalnovid/bin
          merge-multiple: true
      - run: chmod -R a+x docker-dalnovid/bin
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dalnovid-server" >> "$GITHUB_ENV"
      - name: Tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAGS=$IMAGE:${GITHUB_REF_NAME},$IMAGE:latest" >> "$GITHUB_ENV"
          else
            echo "TAGS=$IMAGE:dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: docker-dalnovid
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.TAGS }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "{linux,windows,macos}-*"
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          files: dist/*
